name: Deploy GitHub Pages previews

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  workflow_dispatch:

permissions:
  contents: write

# The gh-pages branch is shared by all previews, so serialize deployments.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      destination_dir: ${{ steps.basepath.outputs.directory }}
      url_path: ${{ steps.basepath.outputs.url_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Determine base path
        id: basepath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          BRANCH_SLUG="$(printf '%s' "$BRANCH_SLUG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            if [[ "$REPO_NAME" == *.github.io ]]; then
              SITE_PATH=""
            else
              SITE_PATH="/$REPO_NAME"
            fi
          else
            SITE_PATH="/$REPO_NAME/previews/$BRANCH_SLUG"
          fi

          echo "value=$SITE_PATH" >> "$GITHUB_OUTPUT"
          echo "directory=$([[ "$GITHUB_REF_NAME" == "main" ]] && printf '' || printf 'previews/%s' "$BRANCH_SLUG")" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == "main" && "$REPO_NAME" == *.github.io ]]; then
            URL_PATH="/"
          else
            URL_PATH="/$REPO_NAME${SITE_PATH#/$REPO_NAME}/"
          fi
          echo "url_path=$URL_PATH" >> "$GITHUB_OUTPUT"

      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ steps.basepath.outputs.value }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./out

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --runInBand

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

  deploy:
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./out

      - name: Publish branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          destination_dir: ${{ needs.build.outputs.destination_dir }}
          keep_files: true

      - name: Report preview URL
        run: echo "Published at https://${GITHUB_REPOSITORY_OWNER}.github.io${{ needs.build.outputs.url_path }}"
